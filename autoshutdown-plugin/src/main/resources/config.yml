
# Hora en que empieza a vigilar si el servidor está vacío (formato 24h, 0-23)
start-hour: 3

# Hora en que deja de vigilar (formato 24h, 0-23)
# Si start-hour > end-hour, la ventana cruza medianoche (ej. 23 -> 7)
end-hour: 7

# Minutos de gracia antes de apagar de verdad una vez detectado el servidor vacío
# dentro de la ventana. Si entra un jugador en ese tiempo, se cancela.
grace-period-minutes: 5
